<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}finget Dashboard{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        surface: {
                            900: '#0f172a', 800: '#1e293b', 700: '#334155', 600: '#475569',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: #1e293b; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        .text-up { color: #ef4444; }    /* 红涨 */
        .text-down { color: #22c55e; }  /* 绿跌 */
        .bg-up { background-color: #ef4444; }
        .bg-down { background-color: #22c55e; }
        .nav-link { transition: all 0.15s ease; }
        .nav-link:hover { background-color: #334155; }
        .nav-link.active { background-color: #334155; color: #22d3ee; border-bottom: 2px solid #22d3ee; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 8px; }
    </style>
    {% block head_extra %}{% endblock %}
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">
    <!-- 顶部导航 -->
    <nav class="bg-slate-800 border-b border-slate-700 px-6 py-0 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-1">
            <a href="/" class="text-cyan-400 font-bold text-lg mr-4 no-underline">📊 finget</a>
            <a href="/" class="nav-link px-4 py-3 text-sm font-medium no-underline text-slate-300 rounded-t {{ 'active' if page == 'dashboard' else '' }}">仪表盘</a>
            <a href="/kline" class="nav-link px-4 py-3 text-sm font-medium no-underline text-slate-300 rounded-t {{ 'active' if page == 'kline' else '' }}">K线分析</a>
            <a href="/research" class="nav-link px-4 py-3 text-sm font-medium no-underline text-slate-300 rounded-t {{ 'active' if page == 'research' else '' }}">研报中心</a>
            <a href="/survey" class="nav-link px-4 py-3 text-sm font-medium no-underline text-slate-300 rounded-t {{ 'active' if page == 'survey' else '' }}">机构调研</a>
            <a href="/broker" class="nav-link px-4 py-3 text-sm font-medium no-underline text-slate-300 rounded-t {{ 'active' if page == 'broker' else '' }}">券商金股</a>
        </div>
        <div class="text-xs text-slate-500">v0.1.0</div>
    </nav>

    <!-- 主内容 -->
    <main class="flex-1 overflow-auto">
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
