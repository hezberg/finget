[project]
name = "finget"
version = "0.1.0"
description = "金融数据获取、存储与分发系统 — 基于 DuckDB 的时序数据管理框架"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "finget contributors" },
]
keywords = ["finance", "duckdb", "tushare", "time-series", "etl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    # 存储
    "duckdb>=1.1.0",
    # 数据源
    "tushare>=1.4.0",
    # 数据处理
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    # 配置 & CLI
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",  # .env 文件加载
    "click>=8.1.0",
    "rich>=13.7.0",          # 进度条 & 美化输出
    # HTTP
    "httpx>=0.27.0",
    # 日志
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "ipython>=8.20.0",
    "respx>=0.21.0",       # HTTP mock
]

[project.scripts]
finget = "finget.cli:main"

[project.urls]
Homepage = "https://github.com/your-org/finget"
Repository = "https://github.com/your-org/finget"
Issues = "https://github.com/your-org/finget/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finget"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "integration: marks tests as integration tests (require real data source)",
    "slow: marks tests as slow",
]

[tool.coverage.run]
source = ["src/finget"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tushare.*"]
ignore_missing_imports = true
